<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tidepool · Sign in</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="card" aria-labelledby="title">
    <h1 id="title">Tidepool</h1>
    <p class="muted">A tiny demo app for test automation. Sign in with <code>demo</code> / <code>tide-pass</code>.</p>
    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" data-testid="username" autocomplete="username" placeholder="Username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" data-testid="password" autocomplete="current-password" placeholder="Password">
      <label class="inline"><input type="checkbox" id="remember" data-testid="remember"> Remember me</label>
      <button type="submit" data-testid="sign-in">Sign in</button>
      <p id="login-error" role="alert" data-testid="login-error" class="error" hidden></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
